<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <img src="assets/logo.png" class="logo">
    <nav>
        <a href="#">Home</a>
        <a href="#">Brands</a>
        <a href="#">Sneakers</a>
        <a href="#">Sports</a>
        <a href="#">Luxury</a>
    </nav>
    <div class="nav-icons">
        <span>🔍</span>
        <span>🛒</span>
    </div>
</header>

<!-- HERO SECTION -->
<section class="hero">
    <div class="hero-text">
        <h1>ALL BRANDS.<br>ONE ORBIT.</h1>
        <p>Access global footwear brands in one place.</p>
        <button>Explore Now</button>
    </div>
</section>

<!-- CATEGORY SECTION -->
<section class="categories">
    <h2>Shop by Category</h2>
    <div class="category-grid">
        <div class="card">Sneakers</div>
        <div class="card">Running</div>
        <div class="card">Streetwear</div>
        <div class="card">Luxury</div>
    </div>
</section>

<!-- PRODUCT GRID -->
<section class="products">
    <h2>Trending Now</h2>
    <div class="product-grid">

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Nike Air Max</h3>
            <p>$120</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Puma RS-X</h3>
            <p>$110</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Adidas Ultraboost</h3>
            <p>$150</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>New Balance 550</h3>
            <p>$130</p>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 ORBIT. All Rights Reserved.</p>
</footer>

</body>
</html>
